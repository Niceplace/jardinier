[project]
name = "jardinier"
version = "0.1.0"
description = "Banking statements processor into firefly-iii"
requires-python = ">=3.11"
dependencies = [
    "pdfplumber>=0.11.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "truststore>=0.10.0",
    "click>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.10.0",
    "pyinstaller>=6.0.0",
    "ruff>=0.15.0",
]

[project.scripts]
jardinier = "cli.main:cli"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["app", "cli"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src"]

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["src"]
